<button class="login-button" (click)="userService.isLoggedIn() ? userService.logOut() : toggleLoginPopup('login')">
  {{ userService.isLoggedIn() ? 'Logout' : 'Login' }}
</button>
<button *ngIf="!userService.isLoggedIn()" class="signup-button" (click)="toggleLoginPopup('register')">
  {{ userService.isLoggedIn() ? 'Logout' : 'Sign Up' }}
</button>

<h1 class="mainTitle">Silly Contracts</h1>

<div class="container-fluid">
  <div class="row">
    <div class="col-sm-2">
      <app-sidebar></app-sidebar>
    </div>
    <div class="col-sm">
      <div>
        <app-login-popup *ngIf="loginModal.show$ | async" (close)="loginModal.close()" [initialMode]="loginModal.loginMode$ | async"></app-login-popup>
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
  <footer style="text-align:center; padding-top: 15px;">
    <br>
    <hr>&copy; &reg; PanWebEntertainment 
  </footer>
</div>
