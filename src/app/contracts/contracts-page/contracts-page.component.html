<app-new-contract-form (newContractEmitter)="addContract($event)"></app-new-contract-form>
<br>
<br>

<ng-container *ngIf="userContracts$ | async as contracts;">

    <h2 *ngIf="contracts.length>0; else loggedOut">Pending Contracts</h2>

    <div class="row">
        <div class="col-12 col-md-6 col-lg-4" *ngFor="let contract of contracts">
            <app-contract-pending
            [contractInfo]="contract"
            >
            </app-contract-pending>
        </div>
    </div>

</ng-container>

<ng-template #loggedOut>
  <p>Please log in to view and manage your contracts. Create a new contract from the form.</p>
</ng-template>
