<div class="modal">
  <form class="modal-content animate" (ngSubmit)="login()" #loginForm="ngForm">
    <span *ngIf="userService.isLoggedIn">Hello, {{ userService.getloggedInUser()}}! </span>
    <div class="imgcontainer">
      <span (click)="closeModal()" class="close" title="Close Modal">&times;</span>
      <img src="img_avatar2.png" alt="Avatar" class="avatar" />
    </div>

    <div class="container">
      <label for="uname"><b>Username</b></label>
      <input
        type="text"
        id="uname"
        placeholder="Enter Username"
        name="uname"
        [(ngModel)]="username"
        required
      />

      <label for="psw"><b>Password</b></label>
      <input
        type="password"
        id="psw"
        placeholder="Enter Password"
        name="psw"
        [(ngModel)]="password"
        required
      />

      <button type="submit" [disabled]="!loginForm.valid">Login</button>
      <label>
        <input type="checkbox" [(ngModel)]="remember" name="remember" />
        Remember me
      </label>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" (click)="closeModal()" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>
</div>
